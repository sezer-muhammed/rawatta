# SPDX-License-Identifier: Apache-2.0
# On a version tag (v0.1.0, ...): build docker/Dockerfile, smoke-test the image, and push it to
# ghcr.io/sezer-muhammed/rawatta:<tag>. A release tag (no pre-release part, e.g. v0.1.0 but not
# v0.2.0-rc1) also moves :latest. No weights are in the image.
name: Docker image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sezer-muhammed/rawatta

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # version = the tag without its leading v (the OCI version label); prerelease = the SemVer
      # version has a pre-release part (a '-'), and then :latest is not moved.
      - name: Check that the tag matches the workspace version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${version} in Cargo.toml"
            exit 1
          fi
          case $version in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "tags<<EOF"
            echo "${IMAGE}:${GITHUB_REF_NAME}"
            if [ "${prerelease}" = false ]; then echo "${IMAGE}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version ${version}, pre-release: ${prerelease}"

      # The CUDA devel and runtime images need more room than the runner has free by default.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (load locally for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: rawatta:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}

      # No GPU on the runner: check the binary, the tools, that the CUDA libraries load, and that the
      # image works under an arbitrary --user uid:gid (the documented way to run it).
      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm rawatta:ci --version
          docker run --rm --user 4321:4321 rawatta:ci --version
          docker run --rm --user 4321:4321 rawatta:ci run --help > /dev/null
          docker run --rm --user 4321:4321 --entrypoint download-weights rawatta:ci --help > /dev/null
          docker run --rm --user 4321:4321 --entrypoint python3 rawatta:ci /opt/rawatta/docker/check_cuda_libs.py
          docker run --rm --user 4321:4321 --entrypoint python3 rawatta:ci /opt/rawatta/tools/convert_weights.py --help > /dev/null
          docker run --rm --user 4321:4321 --entrypoint sh rawatta:ci -c 'touch "$HOME/x" /tmp/x /work/x /weights/x'
          docker run --rm --entrypoint ffmpeg rawatta:ci -hide_banner -version | head -n 1
          label=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' rawatta:ci)
          if [ "$label" != "$VERSION" ]; then echo "::error::version label is '$label', expected '$VERSION'"; exit 1; fi
          docker image ls rawatta:ci

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the build above, so every layer comes from the builder's cache.
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
